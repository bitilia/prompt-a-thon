{% extends "base.html" %}
{% block title %}413 Payload too large — {{ APP_NAME }}{% endblock %}

{% block content %}
<section class="section">
  <div class="container narrow center">
    <p class="error-code" aria-hidden="true">413</p>
    <h1>Payload too large</h1>
    <p class="lead">Your upload exceeded the maximum allowed size.</p>
    <p>
      <a class="btn btn-primary" href="{{ url_for('public.index') }}">Go home</a>
    </p>
  </div>
</section>
{% endblock %}
