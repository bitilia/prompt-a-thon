{% extends "base.html" %}
{% block title %}400 Bad request — {{ APP_NAME }}{% endblock %}

{% block content %}
<section class="section">
  <div class="container narrow center">
    <p class="error-code" aria-hidden="true">400</p>
    <h1>Bad request</h1>
    <p class="lead">The request was malformed and could not be processed.</p>
    <p>
      <a class="btn btn-primary" href="{{ url_for('public.index') }}">Go home</a>
    </p>
  </div>
</section>
{% endblock %}
